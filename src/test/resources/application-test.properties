# H2 in-memory DB for @DataJpaTest. MariaDB compatibility mode so JPQL
# generated for MariaDB (LOWER, CONCAT, LIKE) executes identically.
spring.datasource.url=jdbc:h2:mem:prestamil-test;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from entities for tests
# (avoids running Liquibase changesets containing MariaDB FULLTEXT DDL that H2 cannot parse).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Liquibase for tests — production changesets use MariaDB-specific
# FULLTEXT DDL that breaks under H2.
spring.liquibase.enabled=false

# Disable Spring Session JDBC for unit/IT tests — not needed and would
# require the spring_session tables.
spring.session.store-type=none
