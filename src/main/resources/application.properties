spring.application.name=prestamil

# Database Configuration
spring.datasource.url=jdbc:mariadb://10.103.133.1:3306/CasaEmp_DEV
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=admin
spring.datasource.password=$IgnisD3v_2025

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Spring Session JDBC Configuration
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=embedded
spring.session.timeout.in-seconds=1800

# Server Servlet Cookie Configuration
server.servlet.session.cookie.http-only=true
# Lax: la cookie se envía en peticiones same-site (192.168.50.15:4200 ? :8080).
# NOTA: si usas localhost:4200 con backend en 192.168.50.15:8080 el navegador
# considera la petición cross-site y NO enviará la cookie aunque sea Lax.
# Solución de desarrollo: accede siempre desde http://192.168.50.15:4200
# o configura un proxy en Angular (proxy.conf.json) hacia el backend.
# En producción con HTTPS usa SameSite=None junto con secure=true.
server.servlet.session.cookie.same-site=Lax
# server.servlet.session.cookie.secure=true # Uncomment in production with HTTPS

server.address=0.0.0.0
server.port=8080