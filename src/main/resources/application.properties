spring.application.name=prestamil

# Database Configuration - values come from .env (dev) or environment variables (prod)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Encryption key - comes from .env (dev) or ENCRYPTION_SECRET env var (prod)
app.encryption.secret=${ENCRYPTION_SECRET}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Spring Session JDBC Configuration
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout.in-seconds=1800

# Server Servlet Cookie Configuration
server.servlet.session.cookie.http-only=true
# Lax: la cookie se env�a en peticiones same-site (192.168.50.15:4200 ? :8080).
# NOTA: si usas localhost:4200 con backend en 192.168.50.15:8080 el navegador
# considera la petici�n cross-site y NO enviar� la cookie aunque sea Lax.
# Soluci�n de desarrollo: accede siempre desde http://192.168.50.15:4200
# o configura un proxy en Angular (proxy.conf.json) hacia el backend.
# En producci�n con HTTPS usa SameSite=None junto con secure=true.
server.servlet.session.cookie.same-site=Lax
# server.servlet.session.cookie.secure=true # Uncomment in production with HTTPS

#server.address=0.0.0.0
server.port=8080

# Zona horaria de operacion (America/Mexico_City). El Clock del proyecto la fija en ClockConfig.
# Jackson: fechas con zona (Date, ZonedDateTime, Instant) se serializan en hora del centro de Mexico.
spring.jackson.time-zone=America/Mexico_City
# Sesion JDBC: NOW() y DEFAULT CURRENT_TIMESTAMP (creado_en/actualizado_en) usan esta zona aunque el
# servidor de BD este en UTC. Va como desfase porque MySQL/MariaDB solo aceptan el nombre de la zona
# si se cargaron las tablas mysql.time_zone* (en dev no estan). El centro de Mexico no tiene horario
# de verano desde 2022, asi que America/Mexico_City es siempre -06:00.
spring.datasource.hikari.connection-init-sql=SET time_zone = '-06:00'
