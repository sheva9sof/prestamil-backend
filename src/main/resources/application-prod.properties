# ── Prod profile ─────────────────────────────────────────────────────────────
# Active with: SPRING_PROFILES_ACTIVE=prod
# All secrets MUST be provided as environment variables. Missing vars cause
# startup failure — intentional fail-fast behaviour.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.encryption.secret=${ENCRYPTION_SECRET}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HTTPS required in prod — enable secure + SameSite=None for cross-origin cookies
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None
